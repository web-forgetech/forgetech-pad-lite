; ForgeTech Pad Lite - ESP32-C3 BLE Xbox (XInput Series X) controller: A/B + D-pad + auto-fire
; Serial = UART0 via CH340K COM port (CDC_ON_BOOT=0)
[env:esp32c3]
platform = espressif32 @ 8.0.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter
upload_speed = 921600
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    lemmingdev/ESP32-BLE-Gamepad @ 0.8.0
    h2zero/NimBLE-Arduino @ ^2.5.2
