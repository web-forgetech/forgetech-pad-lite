<svg xmlns="http://www.w3.org/2000/svg" width="680" height="600" viewBox="0 0 680 600" role="img">
<title>ForgeTech Pad Lite button pinout (ESP32-C3)</title>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:600;fill:#2C2C2A}
.teal rect{fill:#E1F5EE;stroke:#0F6E56}.teal .th{fill:#085041}.teal .ts{fill:#0F6E56}
.purple rect{fill:#EEEDFE;stroke:#534AB7}.purple .th{fill:#3C3489}.purple .ts{fill:#534AB7}
.coral rect{fill:#FAECE7;stroke:#993C1D}.coral .th{fill:#712B13}.coral .ts{fill:#993C1D}
</style>
<rect width="680" height="600" fill="#FFFFFF"/>
<text class="th" x="340" y="22" text-anchor="middle">ForgeTech Pad Lite: button pinout</text>
<g transform="translate(0,20)">
<rect x="250" y="30" width="180" height="402" rx="10" fill="#F1EFE8" stroke="#444441" stroke-width="1"/>
<text class="th" x="340" y="52" text-anchor="middle">ESP32-C3 board</text>
<g fill="#888780">
<circle cx="258" cy="76" r="3"/><circle cx="258" cy="100" r="3"/><circle cx="258" cy="124" r="3"/><circle cx="258" cy="148" r="3"/><circle cx="258" cy="196" r="3"/><circle cx="258" cy="220" r="3"/><circle cx="258" cy="244" r="3"/><circle cx="258" cy="340" r="3"/><circle cx="258" cy="364" r="3"/><circle cx="258" cy="388" r="3"/>
<circle cx="422" cy="76" r="3"/><circle cx="422" cy="100" r="3"/><circle cx="422" cy="124" r="3"/><circle cx="422" cy="148" r="3"/><circle cx="422" cy="172" r="3"/><circle cx="422" cy="196" r="3"/><circle cx="422" cy="220" r="3"/><circle cx="422" cy="340" r="3"/><circle cx="422" cy="388" r="3"/>
</g>
<text class="ts" x="268" y="80">GND</text><text class="ts" x="268" y="104">3V3</text><text class="ts" x="268" y="128">3V3</text><text class="ts" x="268" y="152">GPIO2</text><text class="ts" x="268" y="200">GND</text><text class="ts" x="268" y="224">RST</text><text class="ts" x="268" y="248">GND</text><text class="ts" x="268" y="344">GND</text><text class="ts" x="268" y="368">5V0</text><text class="ts" x="268" y="392">5V0</text>
<text class="ts" x="412" y="80" text-anchor="end">GND</text><text class="ts" x="412" y="104" text-anchor="end">GPIO21</text><text class="ts" x="412" y="128" text-anchor="end">GPIO20</text><text class="ts" x="412" y="152" text-anchor="end">GND</text><text class="ts" x="412" y="176" text-anchor="end">GPIO9</text><text class="ts" x="412" y="200" text-anchor="end">GPIO8 LED</text><text class="ts" x="412" y="224" text-anchor="end">GND</text><text class="ts" x="412" y="344" text-anchor="end">GND</text><text class="ts" x="412" y="392" text-anchor="end">GPIO19 free</text>
<text class="th" x="268" y="176">GPIO3</text><text class="th" x="268" y="272">GPIO0</text><text class="th" x="268" y="296">GPIO1</text><text class="th" x="268" y="416">GND</text><text class="th" x="268" y="320">GPIO10</text>
<text class="th" x="412" y="248" text-anchor="end">GPIO7</text><text class="th" x="412" y="272" text-anchor="end">GPIO6</text><text class="th" x="412" y="296" text-anchor="end">GPIO5</text><text class="th" x="412" y="320" text-anchor="end">GPIO4</text><text class="th" x="412" y="416" text-anchor="end">GND</text><text class="th" x="412" y="368" text-anchor="end">GPIO18</text>
<g fill="none" stroke="#1D9E75" stroke-width="2" stroke-linejoin="round">
<path d="M254 172 H190 V150 H130"/><path d="M254 268 H190 V220 H130"/><path d="M254 292 H130"/><path d="M426 316 H470 V390 H550"/>
</g>
<path d="M426 244 H470 V180 H550" fill="none" stroke="#D85A30" stroke-width="2" stroke-linejoin="round"/>
<g fill="none" stroke="#7F77DD" stroke-width="2" stroke-linejoin="round">
<path d="M426 268 H490 V250 H550"/><path d="M426 292 H500 V320 H550"/><path d="M254 316 H190 V360 H130"/><path d="M426 364 H450 V460 H550"/>
</g>
<g fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 3" stroke-linejoin="round">
<path d="M40 150 H24 M40 220 H24 M40 292 H24 M40 360 H24 M24 150 V452 H240 V412 H254"/>
<path d="M640 180 H656 M640 250 H656 M640 320 H656 M640 390 H656 M640 460 H656 M656 180 V500 H440 V412 H426"/>
</g>
<g fill="#1D9E75"><circle cx="258" cy="172" r="4"/><circle cx="258" cy="268" r="4"/><circle cx="258" cy="292" r="4"/><circle cx="422" cy="316" r="4"/></g>
<g fill="#7F77DD"><circle cx="422" cy="268" r="4"/><circle cx="422" cy="292" r="4"/><circle cx="258" cy="316" r="4"/><circle cx="422" cy="364" r="4"/></g>
<circle cx="422" cy="244" r="4" fill="#D85A30"/>
<g fill="#5F5E5A"><circle cx="258" cy="412" r="4"/><circle cx="422" cy="412" r="4"/></g>
<g class="teal" stroke-width="0.8">
<rect x="40" y="126" width="90" height="48" rx="8"/><text class="th" x="85" y="146" text-anchor="middle">Left</text><text class="ts" x="85" y="164" text-anchor="middle">Stick left</text>
<rect x="40" y="196" width="90" height="48" rx="8"/><text class="th" x="85" y="216" text-anchor="middle">Up</text><text class="ts" x="85" y="234" text-anchor="middle">Stick up</text>
<rect x="40" y="268" width="90" height="48" rx="8"/><text class="th" x="85" y="288" text-anchor="middle">Down</text><text class="ts" x="85" y="306" text-anchor="middle">Stick down</text>
<rect x="550" y="366" width="90" height="48" rx="8"/><text class="th" x="595" y="386" text-anchor="middle">Right</text><text class="ts" x="595" y="404" text-anchor="middle">Stick right</text>
</g>
<g class="coral" stroke-width="0.8">
<rect x="550" y="156" width="90" height="48" rx="8"/><text class="th" x="595" y="176" text-anchor="middle">Turbo</text><text class="ts" x="595" y="194" text-anchor="middle">Auto-fire A</text>
</g>
<g class="purple" stroke-width="0.8">
<rect x="550" y="226" width="90" height="48" rx="8"/><text class="th" x="595" y="246" text-anchor="middle">B</text><text class="ts" x="595" y="264" text-anchor="middle">Xbox B</text>
<rect x="550" y="296" width="90" height="48" rx="8"/><text class="th" x="595" y="316" text-anchor="middle">A</text><text class="ts" x="595" y="334" text-anchor="middle">Xbox A</text><rect x="40" y="336" width="90" height="48" rx="8"/><text class="th" x="85" y="356" text-anchor="middle">X</text><text class="ts" x="85" y="374" text-anchor="middle">Xbox X</text><rect x="550" y="436" width="90" height="48" rx="8"/><text class="th" x="595" y="456" text-anchor="middle">Y</text><text class="ts" x="595" y="474" text-anchor="middle">Xbox Y</text>
</g>
<line x1="30" y1="540" x2="54" y2="540" stroke="#1D9E75" stroke-width="2"/><text class="ts" x="60" y="544">Left stick</text>
<line x1="150" y1="540" x2="174" y2="540" stroke="#7F77DD" stroke-width="2"/><text class="ts" x="180" y="544">Xbox A B X Y</text>
<line x1="280" y1="540" x2="304" y2="540" stroke="#D85A30" stroke-width="2"/><text class="ts" x="310" y="544">Turbo toggle</text>
<line x1="430" y1="540" x2="454" y2="540" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 3"/><text class="ts" x="460" y="544">GND (common)</text>
</g>
</svg>
