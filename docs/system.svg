<svg xmlns="http://www.w3.org/2000/svg" width="690" height="316" viewBox="0 0 690 316"><title>How the controller reaches macOS and Windows</title><style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:600;fill:#2C2C2A}
.title{font-size:16px;font-weight:600;fill:#2C2C2A}
.teal rect,.teal circle{fill:#E1F5EE;stroke:#0F6E56}.teal .th{fill:#085041}.teal .ts{fill:#0F6E56}
.purple rect,.purple circle{fill:#EEEDFE;stroke:#534AB7}.purple .th{fill:#3C3489}.purple .ts{fill:#534AB7}
.coral rect,.coral circle{fill:#FAECE7;stroke:#993C1D}.coral .th{fill:#712B13}.coral .ts{fill:#993C1D}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A}.gray .th{fill:#2C2C2A}.gray .ts{fill:#5F5E5A}
.blue rect{fill:#E6F1FB;stroke:#185FA5}.blue .th{fill:#0C447C}.blue .ts{fill:#185FA5}
.amber rect{fill:#FAEEDA;stroke:#854F0B}.amber .th{fill:#633806}.amber .ts{fill:#854F0B}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="690" height="316" fill="#FFFFFF"/><text class="title" x="345.0" y="28" text-anchor="middle">How the controller reaches macOS and Windows</text><g class="coral"><rect x="20" y="60" width="140" height="72" rx="8" stroke-width="0.8"/><text class="th" x="90.0" y="84.0" text-anchor="middle" dominant-baseline="central">Forgetech Pad</text><text class="ts" x="90.0" y="102.0" text-anchor="middle" dominant-baseline="central">ESP32-C3</text><text class="ts" x="90.0" y="118.0" text-anchor="middle" dominant-baseline="central">Xbox Series X mode</text></g><g class="blue"><rect x="190" y="60" width="140" height="72" rx="8" stroke-width="0.8"/><text class="th" x="260.0" y="84.0" text-anchor="middle" dominant-baseline="central">Mac</text><text class="ts" x="260.0" y="102.0" text-anchor="middle" dominant-baseline="central">pair here</text><text class="ts" x="260.0" y="118.0" text-anchor="middle" dominant-baseline="central">(Bluetooth settings)</text></g><g class="gray"><rect x="360" y="60" width="140" height="72" rx="8" stroke-width="0.8"/><text class="th" x="430.0" y="84.0" text-anchor="middle" dominant-baseline="central">Parallels</text><text class="ts" x="430.0" y="102.0" text-anchor="middle" dominant-baseline="central">shares controller</text><text class="ts" x="430.0" y="118.0" text-anchor="middle" dominant-baseline="central">with Windows</text></g><g class="teal"><rect x="530" y="60" width="140" height="72" rx="8" stroke-width="0.8"/><text class="th" x="600.0" y="84.0" text-anchor="middle" dominant-baseline="central">Windows game</text><text class="ts" x="600.0" y="102.0" text-anchor="middle" dominant-baseline="central">sees a Virtual</text><text class="ts" x="600.0" y="118.0" text-anchor="middle" dominant-baseline="central">Xbox Controller</text></g><line x1="162" y1="96" x2="186" y2="96" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/><line x1="332" y1="96" x2="356" y2="96" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/><line x1="502" y1="96" x2="526" y2="96" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/><text class="ts" x="175" y="150" text-anchor="middle">Bluetooth LE</text><line x1="260" y1="134" x2="260" y2="182" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/><g class="blue"><rect x="190" y="186" width="140" height="56" rx="8" stroke-width="0.8"/><text class="th" x="260.0" y="205.0" text-anchor="middle" dominant-baseline="central">macOS games</text><text class="ts" x="260.0" y="224.0" text-anchor="middle" dominant-baseline="central">use it directly</text></g><text class="ts" x="340" y="276" text-anchor="middle">The Mac sees an "Xbox Wireless Controller". Parallels 18+ passes every controller macOS supports</text><text class="ts" x="340" y="294" text-anchor="middle">to Windows 10/11 as a "Virtual Xbox Controller", so the same pad works on both sides.</text></svg>