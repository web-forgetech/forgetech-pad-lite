<svg xmlns="http://www.w3.org/2000/svg" width="680" height="368" viewBox="0 0 680 368"><title>Controller layout (top view)</title><style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:600;fill:#2C2C2A}
.title{font-size:16px;font-weight:600;fill:#2C2C2A}
.teal rect,.teal circle{fill:#E1F5EE;stroke:#0F6E56}.teal .th{fill:#085041}.teal .ts{fill:#0F6E56}
.purple rect,.purple circle{fill:#EEEDFE;stroke:#534AB7}.purple .th{fill:#3C3489}.purple .ts{fill:#534AB7}
.coral rect,.coral circle{fill:#FAECE7;stroke:#993C1D}.coral .th{fill:#712B13}.coral .ts{fill:#993C1D}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A}.gray .th{fill:#2C2C2A}.gray .ts{fill:#5F5E5A}
.blue rect{fill:#E6F1FB;stroke:#185FA5}.blue .th{fill:#0C447C}.blue .ts{fill:#185FA5}
.amber rect{fill:#FAEEDA;stroke:#854F0B}.amber .th{fill:#633806}.amber .ts{fill:#854F0B}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="368" fill="#FFFFFF"/><text class="title" x="340.0" y="28" text-anchor="middle">Controller layout (top view)</text><rect x="60" y="50" width="560" height="250" rx="70" fill="#F1EFE8" stroke="#444441" stroke-width="1.2"/><text class="th" x="340" y="82" text-anchor="middle">ForgeTech Pad Lite</text><g class="teal"><circle cx="190" cy="125" r="25" stroke-width="0.8"/><text class="th" x="190" y="120" text-anchor="middle" dominant-baseline="central">Up</text><text class="ts" x="190" y="136" text-anchor="middle" dominant-baseline="central">GPIO0</text></g><g class="teal"><circle cx="190" cy="235" r="25" stroke-width="0.8"/><text class="th" x="190" y="230" text-anchor="middle" dominant-baseline="central">Down</text><text class="ts" x="190" y="246" text-anchor="middle" dominant-baseline="central">GPIO1</text></g><g class="teal"><circle cx="135" cy="180" r="25" stroke-width="0.8"/><text class="th" x="135" y="175" text-anchor="middle" dominant-baseline="central">Left</text><text class="ts" x="135" y="191" text-anchor="middle" dominant-baseline="central">GPIO3</text></g><g class="teal"><circle cx="245" cy="180" r="25" stroke-width="0.8"/><text class="th" x="245" y="175" text-anchor="middle" dominant-baseline="central">Right</text><text class="ts" x="245" y="191" text-anchor="middle" dominant-baseline="central">GPIO4</text></g><text class="ts" x="190" y="184" text-anchor="middle">left stick</text><g class="purple"><circle cx="510" cy="125" r="25" stroke-width="0.8"/><text class="th" x="510" y="120" text-anchor="middle" dominant-baseline="central">Y</text><text class="ts" x="510" y="136" text-anchor="middle" dominant-baseline="central">GPIO18</text></g><g class="purple"><circle cx="510" cy="235" r="25" stroke-width="0.8"/><text class="th" x="510" y="230" text-anchor="middle" dominant-baseline="central">A</text><text class="ts" x="510" y="246" text-anchor="middle" dominant-baseline="central">GPIO5</text></g><g class="purple"><circle cx="455" cy="180" r="25" stroke-width="0.8"/><text class="th" x="455" y="175" text-anchor="middle" dominant-baseline="central">X</text><text class="ts" x="455" y="191" text-anchor="middle" dominant-baseline="central">GPIO10</text></g><g class="purple"><circle cx="565" cy="180" r="25" stroke-width="0.8"/><text class="th" x="565" y="175" text-anchor="middle" dominant-baseline="central">B</text><text class="ts" x="565" y="191" text-anchor="middle" dominant-baseline="central">GPIO6</text></g><g class="coral"><rect x="300" y="205" width="80" height="34" rx="17" stroke-width="0.8"/><text class="th" x="340" y="217" text-anchor="middle" dominant-baseline="central">Turbo</text><text class="ts" x="340" y="231" text-anchor="middle" dominant-baseline="central">GPIO7</text></g><circle cx="340" cy="130" r="9" fill="#97C459" stroke="#3B6D11" stroke-width="0.8"/><text class="ts" x="340" y="160" text-anchor="middle">Status LED (GPIO8)</text><text class="ts" x="340" y="330" text-anchor="middle">Direction buttons push the Xbox left stick fully (two at once = diagonal). A, B, X, Y are the Xbox face buttons.</text><text class="ts" x="340" y="348" text-anchor="middle">Turbo turns auto-fire on A on/off. All buttons connect between their GPIO and GND.</text></svg>