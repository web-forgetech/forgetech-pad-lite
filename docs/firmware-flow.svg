<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480"><title>What the firmware does (main loop)</title><style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:600;fill:#2C2C2A}
.title{font-size:16px;font-weight:600;fill:#2C2C2A}
.teal rect,.teal circle{fill:#E1F5EE;stroke:#0F6E56}.teal .th{fill:#085041}.teal .ts{fill:#0F6E56}
.purple rect,.purple circle{fill:#EEEDFE;stroke:#534AB7}.purple .th{fill:#3C3489}.purple .ts{fill:#534AB7}
.coral rect,.coral circle{fill:#FAECE7;stroke:#993C1D}.coral .th{fill:#712B13}.coral .ts{fill:#993C1D}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A}.gray .th{fill:#2C2C2A}.gray .ts{fill:#5F5E5A}
.blue rect{fill:#E6F1FB;stroke:#185FA5}.blue .th{fill:#0C447C}.blue .ts{fill:#185FA5}
.amber rect{fill:#FAEEDA;stroke:#854F0B}.amber .th{fill:#633806}.amber .ts{fill:#854F0B}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="480" fill="#FFFFFF"/><text class="title" x="340.0" y="28" text-anchor="middle">What the firmware does (main loop)</text><g class="gray"><rect x="190" y="50" width="300" height="50" rx="8" stroke-width="0.8"/><text class="th" x="340.0" y="66.0" text-anchor="middle" dominant-baseline="central">setup()</text><text class="ts" x="340.0" y="85.0" text-anchor="middle" dominant-baseline="central">pull-ups on, start BLE as Xbox Series X</text></g><g class="teal"><rect x="190" y="120" width="300" height="50" rx="8" stroke-width="0.8"/><text class="th" x="340.0" y="136.0" text-anchor="middle" dominant-baseline="central">Read buttons</text><text class="ts" x="340.0" y="155.0" text-anchor="middle" dominant-baseline="central">debounced, 20 ms</text></g><g class="coral"><rect x="190" y="190" width="300" height="50" rx="8" stroke-width="0.8"/><text class="th" x="340.0" y="206.0" text-anchor="middle" dominant-baseline="central">Turbo pressed?</text><text class="ts" x="340.0" y="225.0" text-anchor="middle" dominant-baseline="central">toggle auto-fire on/off</text></g><g class="blue"><rect x="190" y="260" width="300" height="50" rx="8" stroke-width="0.8"/><text class="th" x="340.0" y="276.0" text-anchor="middle" dominant-baseline="central">Host connected?</text><text class="ts" x="340.0" y="295.0" text-anchor="middle" dominant-baseline="central">no: blink LED blue, go back</text></g><g class="purple"><rect x="190" y="330" width="300" height="50" rx="8" stroke-width="0.8"/><text class="th" x="340.0" y="346.0" text-anchor="middle" dominant-baseline="central">Work out A, B, stick</text><text class="ts" x="340.0" y="365.0" text-anchor="middle" dominant-baseline="central">apply auto-fire rule to A</text></g><g class="amber"><rect x="190" y="400" width="300" height="50" rx="8" stroke-width="0.8"/><text class="th" x="340.0" y="416.0" text-anchor="middle" dominant-baseline="central">Anything changed?</text><text class="ts" x="340.0" y="435.0" text-anchor="middle" dominant-baseline="central">yes: send one BLE report</text></g><line x1="340.0" y1="100" x2="340.0" y2="116" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/><line x1="340.0" y1="170" x2="340.0" y2="186" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/><line x1="340.0" y1="240" x2="340.0" y2="256" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/><line x1="340.0" y1="310" x2="340.0" y2="326" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/><line x1="340.0" y1="380" x2="340.0" y2="396" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/><path d="M490 425 H540 V145 H496" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/><text class="ts" x="548" y="285.0">every 5 ms</text></svg>